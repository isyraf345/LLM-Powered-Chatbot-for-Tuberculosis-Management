name: tb-chatbot
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: tb_chatbot
      POSTGRES_USER: tb_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tb_app -d tb_chatbot"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
